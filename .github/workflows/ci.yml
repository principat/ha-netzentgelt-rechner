name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v7
      - uses: actions/checkout@v7
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v7
      - uses: actions/checkout@v7
      - run: uv sync
      - run: uv run pytest
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
  e2e:
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ha: ["2026.2", "2026.10"]
    steps:
      - uses: astral-sh/setup-uv@v7
      - uses: actions/checkout@v7
      - run: uv sync
      - run: scripts/e2e.sh ${{ matrix.ha }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-ha-log-${{ matrix.ha }}
          path: e2e-ha.log
          if-no-files-found: ignore
  ui:
    # visual check in the real frontend; screenshots are the evidence (not a release gate)
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run python -m playwright install --with-deps chromium
      - run: scripts/e2e-ui.sh 2026.10
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-screenshots
          path: tests/e2e/screenshots/*.png
          if-no-files-found: ignore
