name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  asset:
    # Releases created with GITHUB_TOKEN do not trigger `release: published`,
    # so the ZIP is built and attached in the same workflow run.
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - run: cd custom_components/netzentgelt_rechner && zip -r ../../netzentgelt_rechner.zip .
      - run: gh release upload "${{ needs.release-please.outputs.tag_name }}" netzentgelt_rechner.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
