[pytest]
; Separate from tests/: talks to a real Home Assistant over real sockets, so the HA test plugin
; (registered globally via the pytest11 entry point) and pytest-socket must be disabled.
addopts = -p no:homeassistant -p no:socket -p no:cacheprovider
pythonpath = ../.. .. .
markers =
    e2e: needs running HA container
